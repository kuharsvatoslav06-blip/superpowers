<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Стиль «ночная инфографика» — движок 9:16</title>
<style>
  html,body{margin:0;height:100%;background:#050606;color:#aaa;font-family:Inter,system-ui,sans-serif}
  #wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px}
  canvas{height:calc(100vh - 70px);aspect-ratio:9/16;background:#000;box-shadow:0 0 40px #000}
  #ui{display:flex;gap:10px;align-items:center;font-size:13px}
  #ui input{width:340px}
  button{background:#1b2122;color:#ddd;border:1px solid #333;padding:4px 12px;border-radius:4px;cursor:pointer}
  body.export #ui{display:none} body.export canvas{height:auto;box-shadow:none}
  body.export #wrap{display:block}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="ui"><button id="pp">⏸</button><input id="seek" type="range" min="0" max="1000" value="0"><span id="tc">0.0</span></div>
</div>
<script>
'use strict';
/* =====================================================================
   БАЗА: логическое полотно 576×1024 (9:16), рендер в 1080×1920
   ===================================================================== */
const W = 576, H = 1024;
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const SC = cv.width / W;

/* ---------- палитра ролика ---------- */
const C = {
  black:'#050606', ink:'#0a0d0d',
  white:'#f2f2ee', gray:'#9aa3a3', dim:'#6b7474',
  gold:'#c9a25e',
  blue:'#4d7fd0', blueLite:'#8fb8ff', blueFill:'rgba(62,108,186,0.62)',
  red:'#ff4d4d', redFill:'rgba(94,26,28,0.9)',
  terrain:'#1f2923', water:'#21406c', river:'#4a7fc4',
};

/* ---------- утилиты ---------- */
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const inv=(a,b,v)=>clamp((v-a)/(b-a));
const E={
  out:t=>1-Math.pow(1-t,3),
  inOut:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outBack:t=>{const c=1.6;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)},
};
// окно появления: 0→1 на [a,a+d]
const win=(t,a,d=.6,ease=E.out)=>ease(inv(a,a+d,t));

function hash(i,j,s){const v=Math.sin(i*127.1+j*311.7+s*74.7)*43758.5453;return v-Math.floor(v)}
function vnoise(x,y,s){
  const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j;
  const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=hash(i,j,s),b=hash(i+1,j,s),c=hash(i,j+1,s),d=hash(i+1,j+1,s);
  return lerp(lerp(a,b,ux),lerp(c,d,ux),uy);
}
function fbm(x,y,s,o=4){let v=0,a=.5,f=1,n=0;for(let k=0;k<o;k++){v+=a*vnoise(x*f,y*f,s+k*13);n+=a;a*=.5;f*=2}return v/n}
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

/* ---------- текст ---------- */
const F={
  title:s=>`900 ${s}px "Inter Display","Inter",sans-serif`,
  bold:s=>`700 ${s}px "Inter","Inter Display",sans-serif`,
  semi:s=>`600 ${s}px "Inter",sans-serif`,
  reg:s=>`500 ${s}px "Inter",sans-serif`,
};
function text(str,x,y,o={}){
  ctx.save();
  ctx.font=o.font||F.reg(13);
  ctx.fillStyle=o.color||C.white;
  ctx.textAlign=o.align||'center';
  ctx.textBaseline=o.base||'alphabetic';
  ctx.letterSpacing=(o.ls||0)+'px';
  ctx.globalAlpha*=o.alpha==null?1:o.alpha;
  if(o.glow){ctx.shadowColor=o.glow;ctx.shadowBlur=o.glowBlur||14}
  if(o.shadow!==false&&!o.glow){ctx.shadowColor='rgba(0,0,0,.75)';ctx.shadowBlur=6;ctx.shadowOffsetY=1}
  ctx.fillText(str,x,y+(o.dy||0));
  ctx.restore();
}
// появление текста: подъём на 10px + проявление
function riseText(str,x,y,t,a,o={}){
  const k=win(t,a,o.d||.7);
  if(k<=0)return;
  text(str,x,y,{...o,alpha:(o.alpha??1)*k,dy:(1-k)*10});
}
// печатная машинка
function typeText(str,x,y,t,a,cps,o={}){
  if(t<a)return;
  const n=Math.min(str.length,Math.floor((t-a)*cps));
  const caret=(n<str.length||Math.floor(t*2.2)%2===0)?'▌':'';
  text(str.slice(0,n)+(n<str.length?caret:''),x,y,o);
}

/* =====================================================================
   ШАПКА: прогресс I–IV, большой заголовок, золотой подзаголовок, описание
   ===================================================================== */
function progressBar(active,alpha=1,y=30){
  const segW=52,gap=6,total=4*segW+3*gap,x0=(W-total)/2;
  const nums=['I','II','III','IV'];
  ctx.save();ctx.globalAlpha*=alpha;
  for(let i=0;i<4;i++){
    const x=x0+i*(segW+gap);
    const on=i<active, cur=i===Math.ceil(active)-1;
    ctx.fillStyle=on?(cur?C.blue:'rgba(77,127,208,.55)'):'rgba(120,130,130,.28)';
    if(on&&cur){ctx.shadowColor=C.blue;ctx.shadowBlur=8}else ctx.shadowBlur=0;
    ctx.fillRect(x,y,segW,3);
    ctx.shadowBlur=0;
    text(nums[i],x+segW/2,y-7,{font:F.semi(9),color:on?'#c9d6ea':C.dim,shadow:false});
  }
  ctx.restore();
}
function header(t,a,{title,sub,desc,stage,y=78,size=38}){
  if(stage!=null)progressBar(stage,win(t,a-.2,.6));
  riseText(title,W/2,y,t,a,{font:F.title(size),ls:.5});
  if(sub)riseText(sub,W/2,y+24,t,a+.25,{font:F.bold(11.5),color:C.gold,ls:2.6});
  if(desc)riseText(desc,W/2,y+(sub?44:28),t,a+.45,{font:F.reg(11),color:C.gray});
}
// подпись слева с золотой вертикальной чертой («Главный удар»)
function sideCaption(t,a,x,y,title,sub){
  const k=win(t,a,.8);if(k<=0)return;
  ctx.save();ctx.globalAlpha*=k;
  ctx.fillStyle=C.gold;ctx.fillRect(x,y-15,2,lerp(0,36,k));
  ctx.restore();
  riseText(title,x+10,y,t,a+.1,{font:F.bold(15),align:'left'});
  riseText(sub,x+10,y+16,t,a+.3,{font:F.reg(10),align:'left',color:C.gray});
}
// плашка со счётчиком (+40 км²)
function statCard(t,a,cx,cy,value,prefix,caption,sub,o={}){
  const k=win(t,a,.6,E.outBack);if(k<=0)return;
  const w=o.w||196,h=o.h||82;
  ctx.save();
  ctx.globalAlpha*=clamp(k);
  ctx.translate(cx,cy);ctx.scale(lerp(.85,1,k),lerp(.85,1,k));
  if(!o.bare){
    ctx.fillStyle='rgba(16,20,20,.86)';ctx.strokeStyle='rgba(255,255,255,.13)';ctx.lineWidth=1;
    ctx.beginPath();ctx.roundRect(-w/2,-h/2,w,h,8);ctx.fill();ctx.stroke();
  }
  const n=Math.round(value*E.out(inv(a+.15,a+1.3,t)));
  const big=o.big||40;
  ctx.font=F.title(big);ctx.letterSpacing='0px';
  const main=`${prefix}${n} км`;const mw=ctx.measureText(main).width;
  text(main,-8,-h/2+big*.95+4,{font:F.title(big),glow:'rgba(150,190,255,.45)',glowBlur:18});
  text('2',-8+mw/2+2,-h/2+big*.5+4,{font:F.title(big*.45),align:'left'});
  text(caption,0,-h/2+big*.95+20,{font:F.semi(10),color:'#d7dbdb'});
  if(sub)text(sub,0,-h/2+big*.95+33,{font:F.reg(8.5),color:C.dim});
  ctx.restore();
}

/* =====================================================================
   СИЛУЭТНЫЕ СЦЕНЫ: небо → свечение → горы → ряды елей → туман → земля
   ===================================================================== */
function sky(stops,glow){
  const g=ctx.createLinearGradient(0,0,0,H);
  stops.forEach(([p,c])=>g.addColorStop(p,c));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(glow){
    const [x,y,r,c]=glow;
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,c);rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  }
}
function sunRays(x,y,n,len,alpha,t){
  ctx.save();ctx.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){
    const a=-Math.PI+(i+.5)/n*Math.PI+Math.sin(t*.15+i)*.01;
    const w=.035+hash(i,3,1)*.03;
    const g=ctx.createRadialGradient(x,y,0,x,y,len);
    g.addColorStop(0,`rgba(255,220,170,${alpha*(.5+hash(i,1,2)*.5)})`);g.addColorStop(1,'rgba(255,220,170,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x,y);ctx.arc(x,y,len,a-w,a+w);ctx.closePath();ctx.fill();
  }
  ctx.restore();
}
function mountains(yb,amp,color,seed,shift=0){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(-10,H);
  for(let x=-10;x<=W+10;x+=6){ctx.lineTo(x,yb-amp*fbm((x+shift)*.006,0,seed,4))}
  ctx.lineTo(W+10,H);ctx.closePath();ctx.fill();
}
// ель: ярусный силуэт
function pine(x,y,h){
  const w=h*.28;ctx.moveTo(x,y-h);
  const tiers=4;
  for(let i=1;i<=tiers;i++){const yy=y-h+h*i/tiers*.92, ww=w*i/tiers;ctx.lineTo(x+ww,yy);ctx.lineTo(x+ww*.45,yy-h*.04)}
  ctx.lineTo(x+w*.12,y);ctx.lineTo(x-w*.12,y);
  for(let i=tiers;i>=1;i--){const yy=y-h+h*i/tiers*.92, ww=w*i/tiers;ctx.lineTo(x-ww*.45,yy-h*.04);ctx.lineTo(x-ww,yy)}
  ctx.closePath();
}
function treeLine(yb,hMin,hMax,color,seed,step,shift=0,ground=true){
  ctx.fillStyle=color;ctx.beginPath();
  const off=((shift%step)+step)%step, base=Math.floor(shift/step);
  for(let i=-2;i*step<W+step*2;i++){
    const k=i+base, x=i*step-off+(hash(k,0,seed)-.5)*step*.8;
    const h=lerp(hMin,hMax,hash(k,1,seed));
    if(hash(k,2,seed)>.12)pine(x,yb+2,h);
  }
  ctx.fill();
  if(ground)ctx.fillRect(0,yb,W,H-yb);
}
function fog(y,h,color,alpha){
  ctx.save();ctx.globalAlpha*=alpha;
  const g=ctx.createLinearGradient(0,y-h/2,0,y+h/2);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.5,color);g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,y-h/2,W,h);ctx.restore();
}
function hill(y,amp,color,seed){
  ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=8)ctx.lineTo(x,y-amp*Math.sin(x/W*Math.PI)*(.7+.3*fbm(x*.01,1,seed,2)));
  ctx.lineTo(W,H);ctx.fill();
}
// путник с рюкзаком; phase — фаза шага
function hiker(x,y,s,phase,color,rim){
  if(rim)hiker(x+1.1*s,y-.4*s,s,phase,rim);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
  const sw=Math.sin(phase), bob=Math.abs(Math.cos(phase))*1.2;
  ctx.translate(0,-bob);
  ctx.lineWidth=4.2;
  ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(sw*7,0);ctx.moveTo(0,-20);ctx.lineTo(-sw*7,0);ctx.stroke();
  ctx.beginPath();ctx.roundRect(-4.5,-38,9,20,3);ctx.fill();            // торс
  ctx.beginPath();ctx.roundRect(-11,-37,8,15,2.5);ctx.fill();           // рюкзак
  ctx.beginPath();ctx.arc(1,-43,4.6,0,7);ctx.fill();                    // голова
  ctx.beginPath();ctx.ellipse(1,-46,5.6,2.6,0,Math.PI,0);ctx.fill();    // кепка/капюшон
  ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(2,-34);ctx.lineTo(7+sw*3,-22);ctx.stroke(); // рука
  ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(8+sw*3,-26);ctx.lineTo(13+sw*5,1);ctx.stroke(); // палка
  ctx.restore();
}
function standing(x,y,s,color,pose=0,rim){
  if(rim)standing(x+1.1*s,y-.3*s,s,rim,pose);
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';
  ctx.lineWidth=4.6;ctx.beginPath();ctx.moveTo(-2,-20);ctx.lineTo(-3,0);ctx.moveTo(2,-20);ctx.lineTo(3,0);ctx.stroke();
  ctx.beginPath();ctx.roundRect(-5.5,-39,11,21,3);ctx.fill();
  ctx.beginPath();ctx.roundRect(-9,-38,6,15,2);ctx.fill();
  ctx.beginPath();ctx.arc(0,-44,5,0,7);ctx.fill();
  ctx.lineWidth=3.2;ctx.beginPath();ctx.moveTo(4,-35);
  if(pose===1)ctx.lineTo(11,-27),ctx.lineTo(13,-31); else if(pose===2)ctx.lineTo(9,-48); else ctx.lineTo(6,-21);
  ctx.stroke();ctx.restore();
}
// дрон-квадрокоптер
function drone(x,y,s,t,color='#0b0e0e',light=true){
  ctx.save();ctx.translate(x,y+Math.sin(t*2.1)*1.5*s);ctx.scale(s,s);ctx.rotate(Math.sin(t*1.3)*.03);
  ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-14,-2);ctx.lineTo(14,-2);ctx.stroke();
  ctx.beginPath();ctx.roundRect(-6,-4.5,12,6,2);ctx.fill();
  ctx.beginPath();ctx.moveTo(-3,1.5);ctx.lineTo(-5,6);ctx.moveTo(3,1.5);ctx.lineTo(5,6);ctx.stroke();
  for(const sx of[-14,14]){
    ctx.fillRect(sx-.8,-6,1.6,4);
    const r=6+Math.sin(t*60+sx)*1.2;
    ctx.globalAlpha=.55;ctx.beginPath();ctx.ellipse(sx,-6.5,r,1,0,0,7);ctx.fill();ctx.globalAlpha=1;
  }
  if(light&&Math.floor(t*1.6)%2===0){ctx.fillStyle='#ff3b30';ctx.shadowColor='#ff3b30';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(0,2.5,1.1,0,7);ctx.fill()}
  ctx.restore();
}
// дым: столб мягких клубов
function smoke(x,y,t,scale=1,alpha=.32,color='40,40,40'){
  ctx.save();ctx.filter='blur(6px)';
  for(let i=0;i<14;i++){
    const life=((t*.11+i/14)%1);
    const py=y-life*260*scale, px=x+Math.sin(life*4+i)*14*scale+life*40*scale;
    const r=(10+life*38)*scale;
    ctx.fillStyle=`rgba(${color},${alpha*Math.sin(life*Math.PI)})`;
    ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();
  }
  ctx.restore();
}
function stars(n,seed,maxY,t){
  for(let i=0;i<n;i++){
    const x=hash(i,1,seed)*W,y=hash(i,2,seed)*maxY,a=.25+.6*hash(i,3,seed)*(.6+.4*Math.sin(t*2+i));
    ctx.fillStyle=`rgba(220,230,255,${a})`;ctx.fillRect(x,y,1,1);
  }
}
function sapling(x,y,s,grow,color){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=2;
  const h=26*grow;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h);ctx.stroke();
  ctx.beginPath();pine(0,-h*.25,h*.95);ctx.fill();
  ctx.beginPath();ctx.ellipse(0,0,9,3,0,0,7);ctx.fill();ctx.restore();
}

/* =====================================================================
   КАРТА: рельеф, вода, зоны (штриховка + неоновый контур), стрелки, метки
   ===================================================================== */
const MW=1200, MH=2000;
let terrainCv=null, hatchPat=null, grainCv=null;
function buildAssets(){
  // рельеф в половинном разрешении → апскейл (он и так мягкий)
  const lw=MW/2,lh=MH/2;
  const lo=document.createElement('canvas');lo.width=lw;lo.height=lh;
  const lc=lo.getContext('2d'), img=lc.createImageData(lw,lh), d=img.data;
  for(let y=0;y<lh;y++)for(let x=0;x<lw;x++){
    const n=fbm(x*.012,y*.012,3,5), n2=fbm((x+1.5)*.012,(y+1.5)*.012,3,5);
    const shade=clamp(.5+(n2-n)*20);                       // отмывка рельефа
    const ridge=1-Math.abs(fbm(x*.02,y*.02,8,3)*2-1);
    let r=20+shade*16+ridge*5, g=27+shade*19+ridge*7, b=23+shade*14+ridge*4;
    const w=fbm(x*.008+40,y*.008,21,4);                    // озёра
    const wk=clamp((w-.71)/.04);
    r=lerp(r,26,wk);g=lerp(g,48,wk);b=lerp(b,86,wk);
    const i=(y*lw+x)*4;d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
  }
  lc.putImageData(img,0,0);
  terrainCv=document.createElement('canvas');terrainCv.width=MW;terrainCv.height=MH;
  const tc=terrainCv.getContext('2d');tc.imageSmoothingQuality='high';tc.drawImage(lo,0,0,MW,MH);
  // реки: случайное блуждание + свечение
  const R=rng(7);
  const river=(x,y,dir,len,w)=>{
    const pts=[[x,y]];let a=dir;
    for(let i=0;i<len;i++){a+=(R()-.5)*.6;x+=Math.cos(a)*9;y+=Math.sin(a)*9;a=lerp(a,dir,.08);pts.push([x,y])}
    tc.save();tc.lineJoin='round';tc.lineCap='round';
    tc.strokeStyle='rgba(74,127,196,.35)';tc.lineWidth=w*3.2;tc.filter='blur(3px)';
    tc.beginPath();pts.forEach((p,i)=>i?tc.lineTo(...p):tc.moveTo(...p));tc.stroke();
    tc.filter='none';tc.strokeStyle=C.river;tc.lineWidth=w;tc.stroke();tc.restore();
  };
  river(-20,1480,-.25,170,3.2);river(380,1440,1.2,70,2.2);river(150,1700,-.9,40,1.8);river(820,2010,-1.55,120,2);
  // штриховка красной зоны
  const hp=document.createElement('canvas');hp.width=hp.height=7*SC;
  const hc=hp.getContext('2d');hc.scale(SC,SC);
  hc.fillStyle=C.redFill;hc.fillRect(0,0,7,7);
  hc.strokeStyle='rgba(255,105,105,.17)';hc.lineWidth=1.1;
  hc.beginPath();hc.moveTo(-1,8);hc.lineTo(8,-1);hc.moveTo(-1,1);hc.lineTo(1,-1);hc.moveTo(6,8);hc.lineTo(8,6);hc.stroke();
  hatchPat=ctx.createPattern(hp,'repeat');hatchPat.setTransform(new DOMMatrix().scale(1/SC));
  // плёночное зерно
  grainCv=document.createElement('canvas');grainCv.width=grainCv.height=256;
  const gc=grainCv.getContext('2d'),gi=gc.createImageData(256,256),R2=rng(3);
  for(let i=0;i<gi.data.length;i+=4){const v=R2()*255;gi.data[i]=gi.data[i+1]=gi.data[i+2]=v;gi.data[i+3]=255}
  gc.putImageData(gi,0,0);
}

/* камера карты */
let cam={x:600,y:1000,z:1};
const P=(x,y)=>[(x-cam.x)*cam.z+W/2,(y-cam.y)*cam.z+H/2];

/* линия фронта (граница зоны) — базовая форма + «продавливания» по этапам */
const baseFront=y=>820+160*(fbm(y*.0022,0,5,3)-.5)*2+42*(fbm(y*.013,0,9,2)-.5)*2+13*(fbm(y*.07,0,17,2)-.5)*2;
const PUSH=[ // этап → набор гауссовых сдвигов {y, amt, s}
  [{y:1000,amt:55,s:60},{y:940,amt:30,s:40}],
  [{y:900,amt:70,s:90},{y:1090,amt:50,s:60}],
  [{y:760,amt:80,s:110},{y:1170,amt:70,s:100}],
  [{y:960,amt:90,s:240},{y:620,amt:80,s:120},{y:1330,amt:60,s:120}],
];
function front(y,s){
  let x=baseFront(y);
  for(let k=0;k<PUSH.length;k++){
    const e=E.inOut(clamp(s-k));if(e<=0)break;
    for(const p of PUSH[k])x+=p.amt*e*Math.exp(-((y-p.y)**2)/(2*p.s*p.s));
  }
  return x;
}
function drawTerrain(){
  ctx.fillStyle='#0c100e';ctx.fillRect(0,0,W,H);
  const [x0,y0]=P(0,0);
  ctx.drawImage(terrainCv,x0,y0,MW*cam.z,MH*cam.z);
}
function frontPath(s,y0=-200,y1=MH+200){
  const pts=[];for(let y=y0;y<=y1;y+=10)pts.push(P(front(y,s),y));return pts;
}
function drawZones(s,o={}){

// стрелка направления: кубическая Безье, «прорисовывается», хвост тает, голова светится
function arrow(pts,p,alpha=1){
  if(p<=0||alpha<=0)return;
  const [a,b,c,d]=pts.map(q=>P(...q));
  const bz=u=>{const m=1-u;return[m*m*m*a[0]+3*m*m*u*b[0]+3*m*u*u*c[0]+u*u*u*d[0],m*m*m*a[1]+3*m*m*u*b[1]+3*m*u*u*c[1]+u*u*u*d[1]]};
  const N=48,S=[];for(let i=0;i<=N;i++)S.push(bz(i/N*p));
  const head=S[N],pre=S[N-2],ang=Math.atan2(head[1]-pre[1],head[0]-pre[0]);
  const hl=13, base=[head[0]-Math.cos(ang)*hl*.7,head[1]-Math.sin(ang)*hl*.7];
  const L=[],R=[];
  for(let i=0;i<=N;i++){
    const q=S[i],nx=S[Math.min(N,i+1)],pv=S[Math.max(0,i-1)];
    const an=Math.atan2(nx[1]-pv[1],nx[0]-pv[0]),w=lerp(.6,3.4,Math.pow(i/N,1.3));
    L.push([q[0]+Math.cos(an+1.57)*w,q[1]+Math.sin(an+1.57)*w]);R.push([q[0]-Math.cos(an+1.57)*w,q[1]-Math.sin(an+1.57)*w]);
  }
  ctx.save();ctx.globalAlpha*=alpha;
  const g=ctx.createLinearGradient(...S[0],...head);
  g.addColorStop(0,'rgba(77,127,208,0)');g.addColorStop(.55,'rgba(110,160,240,.75)');g.addColorStop(1,'rgba(175,205,255,1)');
  ctx.fillStyle=g;ctx.shadowColor='rgba(120,170,255,.9)';ctx.shadowBlur=12;
  ctx.beginPath();L.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q));for(let i=N;i>=0;i--)ctx.lineTo(...R[i]);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c4dbff';ctx.beginPath();
  ctx.moveTo(head[0]+Math.cos(ang)*4,head[1]+Math.sin(ang)*4);
  ctx.lineTo(base[0]+Math.cos(ang+1.57)*8,base[1]+Math.sin(ang+1.57)*8);
  ctx.lineTo(base[0]+Math.cos(ang)*3,base[1]+Math.sin(ang)*3);
  ctx.lineTo(base[0]-Math.cos(ang+1.57)*8,base[1]-Math.sin(ang+1.57)*8);ctx.closePath();ctx.fill();
  ctx.restore();
}

    townLabels(s,1);
    mapLook();
    const st=t<3.2?3:4;
    const hk=1-inv(2.9,3.2,t)+inv(3.2,3.5,t);
    ctx.save();ctx.globalAlpha=clamp(hk);
    header(st===3?t:t-3.2+.5,.25,{title:'ЭТАП '+st,sub:st===3?'28 СЕНТЯБРЯ':'14 ОКТЯБРЯ',desc:st===3?'Северный и южный фланги':'Финальный этап',stage:st});
    ctx.restore();
    mapChrome(1-inv(5.6,6.2,t),{km:10});
    if(t>5.8){
      const k=win(t,5.8,.6);ctx.fillStyle=`rgba(8,10,10,${.75*k})`;ctx.fillRect(0,780,W,H-780);
      statCard(t,5.9,W/2,845,277,'','территории восстановлено',null,{bare:true,big:54,w:300,h:110});
    }
  }],
  // 8. Финал: рассвет, лучи, люди и саженец
  [5.6, t=>{
    sky([[0,'#18222b'],[.25,'#2e3d47'],[.48,'#8a6a4c'],[.58,'#e0a160'],[.62,'#4a4036'],[1,'#07090a']],[W/2,600,320,'rgba(255,215,160,.55)']);
    sunRays(W/2,600,18,560,.05,t);
    const sg=ctx.createRadialGradient(W/2,600,0,W/2,600,40);sg.addColorStop(0,'rgba(255,245,220,.95)');sg.addColorStop(1,'rgba(255,245,220,0)');ctx.fillStyle=sg;ctx.fillRect(W/2-40,560,80,80);
    treeLine(615,14,26,'#1c2222',31,8,t*3);
    fog(625,34,'rgba(220,200,170,.4)',.8);
    treeLine(640,8,16,'#121616',32,6,t*5,false);
    hill(700,30,'#0c0f0f',4);
    ctx.fillStyle='#0c0f0f';ctx.fillRect(0,690,W,H-690);
    standing(200,690,1.35,'#060808',0);standing(230,692,1.3,'#060808',1);
    standing(290,690,1.35,'#060808',2);standing(322,692,1.3,'#060808',0);
    sapling(262,692,1.4,E.outBack(inv(.6,2.2,t)),'#060808');
    vignette(.5);
    progressBar(4,win(t,.4),150);
    riseText('ЧЕТЫРЕ СЕЗОНА',W/2,200,t,.6,{font:F.title(34),ls:.5});
    riseText('НЕСКОЛЬКО МЕСЯЦЕВ РАБОТЫ',W/2,222,t,1,{font:F.bold(11),color:C.gold,ls:2.6});
    riseText('Северный массив · 2026',W/2,770,t,1.6,{font:F.semi(10.5),color:'#b9bfbf'});
  }],
];
// таймлайн
const STARTS=[];let acc=0;for(const [d] of SCENES){STARTS.push(acc);acc+=d-XF}
const DURATION=acc+XF;

function grain(t){
  ctx.save();ctx.globalAlpha=.045;ctx.globalCompositeOperation='overlay';
  const ox=Math.floor(hash(Math.floor(t*30),0,9)*256),oy=Math.floor(hash(Math.floor(t*30),1,9)*256);
  for(let x=-ox;x<W;x+=128)for(let y=-oy;y<H;y+=128)ctx.drawImage(grainCv,x,y,128,128);
  ctx.restore();
}
const layer=document.createElement('canvas');layer.width=cv.width;layer.height=cv.height;
const layerCtx=layer.getContext('2d');
function render(t){
  ctx=mainCtx;
  ctx.setTransform(SC,0,0,SC,0,0);
  ctx.globalAlpha=1;ctx.fillStyle=C.black;ctx.fillRect(0,0,W,H);
  SCENES.forEach(([d,fn],i)=>{
    const lt=t-STARTS[i];if(lt<0||lt>d)return;
    const fadeIn=i===0?inv(0,.8,lt):inv(0,XF,lt), fadeOut=i===SCENES.length-1?1-inv(d-1,d,lt):1-inv(d-XF,d,lt);
    const a=clamp(Math.min(fadeIn,fadeOut));if(a<=0)return;
    // сцена рисуется в отдельный слой, затем слой целиком проявляется (кроссфейд)
    ctx=layerCtx;ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,layer.width,layer.height);
    ctx.setTransform(SC,0,0,SC,0,0);ctx.globalAlpha=1;
    ctx.save();fn(lt);ctx.restore();
    ctx=mainCtx;ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=a;ctx.drawImage(layer,0,0);ctx.restore();
  });
  ctx.setTransform(SC,0,0,SC,0,0);
  grain(t);
}

/* ---------- плеер ---------- */
let playing=true,t0=performance.now(),cur=0;
const seek=document.getElementById('seek'),tc=document.getElementById('tc'),pp=document.getElementById('pp');
pp.onclick=()=>{playing=!playing;pp.textContent=playing?'⏸':'▶';t0=performance.now()-cur*1000};
seek.oninput=()=>{cur=seek.value/1000*DURATION;t0=performance.now()-cur*1000;render(cur)};
function loop(){
  if(playing){cur=((performance.now()-t0)/1000)%DURATION;seek.value=cur/DURATION*1000;tc.textContent=cur.toFixed(1)+' / '+DURATION.toFixed(1)+'s';render(cur)}
  requestAnimationFrame(loop);
}
window.render=render;window.DURATION=DURATION;
document.fonts.load(F.title(40)).then(()=>document.fonts.load(F.bold(12))).then(()=>{
  buildAssets();
  if(location.hash==='#export'){document.body.classList.add('export');window.READY=true}
  else loop();
});
